name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-native:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        id: setup-android
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android NDK and SDK packages
        run: |
          sdkmanager --install \
            "ndk;28.2.13676358" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build native libraries
        run: ./android/build-core.sh
        env:
          ANDROID_NDK: ${{ steps.setup-android.outputs.ndk-path || format('{0}/ndk/28.2.13676358', env.ANDROID_SDK_ROOT) }}

      - name: Check native libraries
        run: |
          ls -lh android/app/src/main/jniLibs/arm64-v8a/
          test -f android/app/src/main/jniLibs/arm64-v8a/libretrosaturn.so
          test -f android/app/src/main/jniLibs/arm64-v8a/libymircore.so
          test -f android/app/libs/SDL3.jar

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Show generated APK
        run: |
          echo "Generated APK:"
          ls -lh android/app/build/outputs/apk/release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Retro-Saturn-Android
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error


  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            liblzma-dev \
            pkg-config \
            ninja-build \
            clang \
            cmake

      - name: Build Linux host tests
        run: core/retro/linux/build-ymir-linux.sh

      - name: Run native tests
        run: |
          for t in core/retro/linux/build/ymir_*_test; do
            echo "== $t"
            "$t"
          done
